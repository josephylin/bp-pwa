<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#01696f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="血壓分析" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="manifest" href="manifest.json" />
<title>血壓分析</title>

<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="light"] {
    --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
    --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
    --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
    --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
    --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
    --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
    --space-4: 1rem; --space-6: 1.5rem; --space-8: 2rem;
    --color-bg: #f7f6f2; --color-surface: #f9f8f5; --color-surface-2: #fbfbf9;
    --color-surface-offset: #f3f0ec;
    --color-text: #28251d; --color-text-muted: #5f5d58; --color-text-faint: #8d8a83;
    --color-text-inverse: #f9f8f4;
    --color-primary: #01696f; --color-primary-hover: #0c4e54;
    --color-success: #437a22; --color-warning: #964219; --color-error: #a12c7b; --color-blue: #006494;
    --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-full: 9999px;
    --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
    --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    --font-body: 'Satoshi', 'Inter', -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  [data-theme="dark"] {
    --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
    --color-surface-offset: #22211f;
    --color-text: #ece9e3; --color-text-muted: #b3aea6; --color-text-faint: #8a857d;
    --color-text-inverse: #171614;
    --color-primary: #4f98a3; --color-primary-hover: #227f8b;
    --color-success: #7fbe56; --color-warning: #e09a68; --color-error: #d163a7; --color-blue: #72acd8;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; font-family: var(--font-body);
    font-size: var(--text-base); background: var(--color-bg); color: var(--color-text); line-height: 1.6;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }

  .app { max-width: 760px; margin: 0 auto; padding: var(--space-4); }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
  .brand { display: flex; align-items: center; gap: var(--space-3); }
  .logo { width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--color-primary), color-mix(in oklab, var(--color-primary) 48%, white));
    color: white; display: grid; place-items: center; box-shadow: var(--shadow-sm); }
  .brand h1 { font-size: var(--text-xl); line-height: 1.1; margin: 0; }
  .brand p { margin: 0; color: var(--color-text-muted); font-size: var(--text-sm); }
  .icon-btn { width: 44px; height: 44px; border-radius: var(--radius-full);
    background: var(--color-surface);
    border: 1px solid color-mix(in oklab, var(--color-text) 10%, transparent);
    display: grid; place-items: center; color: var(--color-text); }
  .icon-btn:hover { background: var(--color-surface-offset); }

  .panel { background: var(--color-surface);
    border: 1px solid color-mix(in oklab, var(--color-text) 8%, transparent);
    border-radius: var(--radius-xl); padding: var(--space-4); box-shadow: var(--shadow-sm); }
  .panel + .panel { margin-top: var(--space-4); }
  .section-title { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; }
  .section-title h2 { font-size: var(--text-lg); margin: 0; }
  .section-title p { margin: 0; font-size: var(--text-sm); color: var(--color-text-muted); }
  .pill { display: inline-flex; align-items: center; gap: 0.35rem; border-radius: var(--radius-full);
    padding: 0.25rem 0.6rem; font-size: var(--text-xs); font-weight: 700;
    background: var(--color-surface-offset); color: var(--color-text-muted); }
  .pill.offline { background: color-mix(in oklab, var(--color-warning) 16%, transparent); color: var(--color-warning); }

  /* Range tabs */
  .range-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); margin-bottom: var(--space-4); }
  .custom-range { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center;
                  padding: var(--space-3); margin-bottom: var(--space-4);
                  background: var(--color-surface-offset); border-radius: var(--radius-md); }
  .custom-range label { display: flex; align-items: center; gap: 0.4rem; font-size: var(--text-sm); color: var(--color-text-muted); }
  .custom-range input[type=date] { padding: 0.4rem 0.6rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm);
                                   background: var(--color-surface); color: var(--color-text); font-size: var(--text-sm); }
  .btn-mini { padding: 0.45rem 0.8rem; font-size: var(--text-sm); font-weight: 600;
              background: var(--color-primary); color: var(--color-text-inverse);
              border: 1px solid var(--color-primary); border-radius: var(--radius-sm); cursor: pointer; }
  .btn-mini.btn-ghost { background: transparent; color: var(--color-text); border-color: var(--color-border); font-weight: 500; }
  .btn-mini.btn-ghost:hover { background: var(--color-surface); }
  @media print { .custom-range { display: none !important; } }
  .range-tabs button { min-height: 44px; border-radius: var(--radius-md);
    background: var(--color-surface);
    border: 1px solid color-mix(in oklab, var(--color-text) 10%, transparent);
    font-weight: 700; font-size: var(--text-sm); transition: all var(--transition); }
  .range-tabs button:hover { background: var(--color-surface-offset); }
  .range-tabs button.active { background: var(--color-primary); color: var(--color-text-inverse); border-color: var(--color-primary); }

  /* KPI grid */
  .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
  .kpi { padding: var(--space-4); border-radius: var(--radius-lg);
    background: var(--color-surface-2);
    border: 1px solid color-mix(in oklab, var(--color-text) 8%, transparent); }
  .kpi .label { font-size: var(--text-xs); color: var(--color-text-muted); display: block; margin-bottom: var(--space-2); }
  .kpi .value { font-size: var(--text-lg); font-weight: 700; font-variant-numeric: tabular-nums lining-nums; }
  .kpi .sub { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-2); }
  .kpi.morning { border-left: 3px solid var(--color-warning); }
  .kpi.evening { border-left: 3px solid var(--color-blue); }
  .kpi.daily   { border-left: 3px solid var(--color-primary); }
  .kpi.target.ok   { border-left: 3px solid var(--color-success); }
  .kpi.target.ok   .value { color: var(--color-success); }
  .kpi.target.warn { border-left: 3px solid var(--color-warning); }
  .kpi.target.warn .value { color: var(--color-warning); }
  .kpi.pulse { border-left: 3px solid #e07b9c; }
  .kpi.pulse .value { color: #c8456f; }
  .pulse-section { margin-top: var(--space-5); padding-top: var(--space-5);
                   border-top: 1px solid color-mix(in oklab, var(--color-text) 8%, transparent); }
  .pulse-section h3 { margin: 0 0 var(--space-3); font-size: var(--text-base); font-weight: 700; }
  /* 達標率口徑切換 — 嚴格（綠）與寬鬆（藍）兩色區分 */
  .mode-toggle { margin-left: 0.4rem; padding: 0.15rem 0.55rem; font-size: 0.7rem; font-weight: 700;
                 border-radius: 999px; cursor: pointer; letter-spacing: 0.04em;
                 transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .mode-toggle.is-strict { border: 1px solid color-mix(in oklab, var(--color-success) 50%, transparent);
                           background: color-mix(in oklab, var(--color-success) 14%, transparent);
                           color: var(--color-success); }
  .mode-toggle.is-loose  { border: 1px solid color-mix(in oklab, var(--color-blue) 50%, transparent);
                           background: color-mix(in oklab, var(--color-blue) 14%, transparent);
                           color: var(--color-blue); }
  .mode-toggle:hover { filter: brightness(1.05); }
  /* 達標卡本身也隨模式加輔助邊框 */
  .kpi.target.is-loose-mode { box-shadow: inset 4px 0 0 0 var(--color-blue); }
  tr.partial-day { background: color-mix(in oklab, var(--color-warning) 4%, transparent); }
  tr.partial-day td { font-style: italic; }
  .partial-mark { font-size: 0.8em; opacity: 0.8; }
  .missing { color: var(--color-text-muted); font-size: 0.85em; opacity: 0.7; }
  /* 達標率定義 — 可展開說明卷 */
  .target-def { margin-top: var(--space-4); padding: var(--space-3) var(--space-4);
                background: var(--color-surface-offset);
                border: 1px solid color-mix(in oklab, var(--color-text) 6%, transparent);
                border-radius: var(--radius-md); font-size: var(--text-sm); }
  .target-def summary { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
                        cursor: pointer; list-style: none; outline: none; user-select: none; }
  .target-def summary::-webkit-details-marker { display: none; }
  .target-def summary::before { content: '▸'; font-size: 0.75em; opacity: 0.5;
                                transition: transform 0.15s; }
  .target-def[open] summary::before { transform: rotate(90deg); }
  .target-def-key { font-weight: 700; color: var(--color-text); }
  .target-def-now { font-size: 0.85em; color: var(--color-text-muted); }
  .target-def-body { margin-top: var(--space-3); padding-top: var(--space-3);
                     border-top: 1px solid color-mix(in oklab, var(--color-text) 6%, transparent); }
  .target-def-body p { margin: 0 0 var(--space-2); line-height: 1.6; }
  .target-def-body p:last-child { margin-bottom: 0; }
  .target-def-body .small { font-size: 0.85em; }
  .badge-strict, .badge-loose { display: inline-block; padding: 0.1rem 0.5rem; margin-right: 0.4rem;
                                font-size: 0.72rem; font-weight: 700; border-radius: 999px;
                                letter-spacing: 0.04em; vertical-align: 1px; }
  .badge-strict { color: var(--color-success);
                  background: color-mix(in oklab, var(--color-success) 14%, transparent);
                  border: 1px solid color-mix(in oklab, var(--color-success) 50%, transparent); }
  .badge-loose  { color: var(--color-blue);
                  background: color-mix(in oklab, var(--color-blue) 14%, transparent);
                  border: 1px solid color-mix(in oklab, var(--color-blue) 50%, transparent); }

  canvas { width: 100% !important; height: 300px !important; }

  table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); font-variant-numeric: tabular-nums lining-nums; }
  th, td { padding: 0.55rem 0.4rem; text-align: right; border-bottom: 1px solid color-mix(in oklab, var(--color-text) 8%, transparent); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--color-text-muted); font-weight: 700; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.04em; }
  .badge-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .badge-dot.ok { background: var(--color-success); }
  .badge-dot.no { background: var(--color-warning); }

  .actions { display: flex; gap: var(--space-3); margin-top: var(--space-4); }
  .btn { min-height: 44px; padding: 0.85rem 1.1rem; border-radius: var(--radius-md);
    font-size: var(--text-sm); font-weight: 700; flex: 1;
    transition: background var(--transition), color var(--transition), transform var(--transition); }
  .btn:active { transform: translateY(1px) scale(0.99); }
  .btn-primary { background: var(--color-primary); color: var(--color-text-inverse); }
  .btn-primary:hover { background: var(--color-primary-hover); }
  .btn-secondary { background: var(--color-surface-offset); color: var(--color-text);
    border: 1px solid color-mix(in oklab, var(--color-text) 10%, transparent); }

  .legend { text-align: center; font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-3); display: flex; gap: var(--space-4); justify-content: center; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
  .legend .swatch { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }

  .empty { text-align: center; padding: var(--space-8) var(--space-4); color: var(--color-text-muted);
    background: var(--color-surface-2); border-radius: var(--radius-lg);
    border: 1px dashed color-mix(in oklab, var(--color-text) 14%, transparent); }
  .loading { text-align: center; padding: var(--space-8); color: var(--color-text-muted); }
  .muted { color: var(--color-text-muted); }
  .warn-text { color: var(--color-warning); font-weight: 700; }

  @media (max-width: 640px) {
    .app { padding: var(--space-3); }
    .kpi-grid { grid-template-columns: 1fr 1fr; }
    .brand h1 { font-size: 1.4rem; }
    .actions { flex-direction: column; }
  }
  @media print {
    body { background: white; }
    .icon-btn, .actions, .range-tabs { display: none !important; }
    .panel { box-shadow: none; border-color: #ccc; page-break-inside: avoid; }
  }
</style>
</head>
<body>
<main class="app">

  <section class="topbar">
    <div class="brand">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/>
        </svg>
      </div>
      <div>
        <h1>血壓分析</h1>
        <p>週 / 月 / 全期間 趨勢與達標率</p>
      </div>
    </div>
    <a class="icon-btn" href="index.html" aria-label="返回紀錄" title="返回紀錄">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </a>
  </section>

  <section class="panel">
    <div class="range-tabs">
      <button data-range="week"  class="active">本週 7 天</button>
      <button data-range="month">本月 30 天</button>
      <button data-range="all">全部</button>
      <button data-range="custom">自訂…</button>
    </div>
    <div id="customRange" class="custom-range" hidden>
      <label>從 <input type="date" id="dateFrom"></label>
      <label>到 <input type="date" id="dateTo"></label>
      <button id="applyRange" class="btn-mini">套用</button>
      <button id="quickThisMonth" class="btn-mini btn-ghost" title="本月 1 號至今">本月迄今</button>
      <button id="quickLastMonth" class="btn-mini btn-ghost" title="上個月全月">上個月</button>
      <button id="quickYTD" class="btn-mini btn-ghost" title="今年 1/1 至今">今年迄今</button>
    </div>
    <div id="content">
      <div class="loading">載入中…</div>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
const ENDPOINT = 'https://script.google.com/macros/s/REPLACE_WITH_YOUR_DEPLOYMENT_ID/exec';
const LS_THEME = 'bp.theme';

/* Theme */
const theme = localStorage.getItem(LS_THEME)
  || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.setAttribute('data-theme', theme);
const isDark = theme === 'dark';
const COLORS = {
  morning: isDark ? '#e09a68' : '#964219',
  evening: isDark ? '#72acd8' : '#006494',
  daily:   isDark ? '#4f98a3' : '#01696f',
  target:  isDark ? '#8a857d' : '#8d8a83',
  grid:    isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)',
  text:    isDark ? '#ece9e3' : '#28251d',
  axis:    isDark ? '#b3aea6' : '#28251d'
};

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
let currentRange = 'week';
let currentFrom = null;  // 'YYYY-MM-DD'
let currentTo = null;
let chart = null;

async function loadStats(range, from, to) {
  $('#content').innerHTML = '<div class="loading">載入中…</div>';
  let url = `${ENDPOINT}?action=stats`;
  if (from && to) url += `&from=${from}&to=${to}`;
  else            url += `&range=${range}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'SERVER_ERROR');
    render(data, false);
  } catch (err) {
    console.warn('API 失敗，改用本機資料：', err);
    render(computeLocalStats(range, from, to), true);
  }
}

/* 離線本機計算 */
function parseLocalTime(s) {
  // 容錯解析：'YYYY-MM-DD HH:mm:ss' 本地時間 / ISO
  if (!s) return null;
  if (s instanceof Date) return isNaN(s) ? null : s;
  const m = String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{1,2}):(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function localDateKey(d) {
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function computeLocalStats(range, fromStr, toStr) {
  const TARGET_SBP = 130, TARGET_DBP = 80;
  let cutoffFrom, cutoffTo;
  if (fromStr && toStr) {
    const fm = fromStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    const tm = toStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    cutoffFrom = new Date(+fm[1], +fm[2]-1, +fm[3], 0, 0, 0);
    cutoffTo   = new Date(+tm[1], +tm[2]-1, +tm[3], 23, 59, 59);
  } else {
    const days = range === 'month' ? 30 : (range === 'all' ? 9999 : 7);
    cutoffFrom = new Date(); cutoffFrom.setDate(cutoffFrom.getDate() - days + 1); cutoffFrom.setHours(0,0,0,0);
    cutoffTo = new Date(); cutoffTo.setHours(23,59,59,999);
  }
  const all = [
    ...(JSON.parse(localStorage.getItem('bp.synced')||'[]')),
    ...(JSON.parse(localStorage.getItem('bp.queue')||'[]'))
  ];
  const byDay = {};
  all.forEach(r => {
    const dt = parseLocalTime(r.recordedAt);
    if (!dt || dt < cutoffFrom || dt > cutoffTo) return;
    if (r.session !== 'morning' && r.session !== 'evening') return;
    const k = localDateKey(dt);
    if (!byDay[k]) byDay[k] = { morning:[], evening:[] };
    byDay[k][r.session].push({ s:r.systolic, d:r.diastolic, p:r.pulse });
  });
  const avg = arr => {
    if (!arr.length) return { s:null, d:null, p:null };
    return {
      s: Math.round(arr.reduce((a,b)=>a+b.s,0)/arr.length),
      d: Math.round(arr.reduce((a,b)=>a+b.d,0)/arr.length),
      p: (() => { const ps = arr.filter(x=>x.p).map(x=>x.p); return ps.length ? Math.round(ps.reduce((a,b)=>a+b,0)/ps.length) : null; })()
    };
  };
  const daily = Object.keys(byDay).sort().map(date => {
    const m = avg(byDay[date].morning), ev = avg(byDay[date].evening);
    const dailySBP = (m.s && ev.s) ? Math.round((m.s+ev.s)/2) : (m.s||ev.s||null);
    const dailyDBP = (m.d && ev.d) ? Math.round((m.d+ev.d)/2) : (m.d||ev.d||null);
    const dailyPulse = (m.p && ev.p) ? Math.round((m.p+ev.p)/2) : (m.p||ev.p||null);
    const isComplete = (m.s !== null && ev.s !== null);
    return {
      date,
      morningSBP:m.s, morningDBP:m.d, morningPulse:m.p, morningCount:byDay[date].morning.length,
      eveningSBP:ev.s, eveningDBP:ev.d, eveningPulse:ev.p, eveningCount:byDay[date].evening.length,
      dailySBP, dailyDBP, dailyPulse,
      isComplete,
      morningSurge: isComplete ? (m.s - ev.s) : null,
      // 達標：「小於或等於」130/80（台灣高血壓學會 2022）
      targetMet: dailySBP <= TARGET_SBP && dailyDBP <= TARGET_DBP,
      // 心跳達標：日均心跳 60–100 bpm（AHA 靜息心率參考值）
      pulseMet: dailyPulse !== null && dailyPulse >= 60 && dailyPulse <= 100
    };
  });
  const mean = (arr, key) => {
    const v = arr.map(x=>x[key]).filter(x=>typeof x==='number');
    return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null;
  };
  const max = (arr, key) => {
    const v = arr.map(x=>x[key]).filter(x=>typeof x==='number');
    return v.length ? Math.max(...v) : null;
  };
  const min = (arr, key) => {
    const v = arr.map(x=>x[key]).filter(x=>typeof x==='number');
    return v.length ? Math.min(...v) : null;
  };
  const PULSE_LOW = 60, PULSE_HIGH = 100;
  const dpv = daily.map(d=>d.dailyPulse).filter(v=>typeof v === 'number');
  return {
    ok:true, range, generatedAt:new Date().toISOString(),
    summary: {
      count: all.length, totalDays: daily.length,
      avgMorningSBP: mean(daily,'morningSBP'), avgMorningDBP: mean(daily,'morningDBP'),
      avgEveningSBP: mean(daily,'eveningSBP'), avgEveningDBP: mean(daily,'eveningDBP'),
      avgDailySBP:   mean(daily,'dailySBP'),   avgDailyDBP:   mean(daily,'dailyDBP'),
      avgMorningPulse: mean(daily,'morningPulse'),
      avgEveningPulse: mean(daily,'eveningPulse'),
      avgDailyPulse:   mean(daily,'dailyPulse'),
      maxSBP: max(daily,'dailySBP'), minSBP: min(daily,'dailySBP'),
      maxPulse: max(daily,'dailyPulse'), minPulse: min(daily,'dailyPulse'),
      pulseInRangeDays: dpv.filter(v=>v>=PULSE_LOW && v<=PULSE_HIGH).length,
      pulseDays: dpv.length,
      pulseLow: PULSE_LOW, pulseHigh: PULSE_HIGH,
      avgMorningSurge: mean(daily,'morningSurge'),
      completeDays:  daily.filter(d=>d.isComplete).length,
      partialDays:   daily.filter(d=>!d.isComplete).length,
      targetMetDays:      daily.filter(d=>d.targetMet && d.isComplete).length,
      targetMetDaysLoose: daily.filter(d=>d.targetMet).length,
      targetMetRate:      (()=>{ const c = daily.filter(d=>d.isComplete).length; return c ? Math.round(daily.filter(d=>d.targetMet && d.isComplete).length / c * 100) : 0; })(),
      targetMetRateLoose: daily.length ? Math.round(daily.filter(d=>d.targetMet).length / daily.length * 100) : 0,
      // 心跳達標率（與血壓達標率平行）
      pulseMetDays:       daily.filter(d=>d.pulseMet && d.isComplete).length,
      pulseMetDaysLoose:  daily.filter(d=>d.pulseMet).length,
      pulseMetRate:       (()=>{ const c = daily.filter(d=>d.isComplete).length; return c ? Math.round(daily.filter(d=>d.pulseMet && d.isComplete).length / c * 100) : 0; })(),
      pulseMetRateLoose:  daily.length ? Math.round(daily.filter(d=>d.pulseMet).length / daily.length * 100) : 0,
      targetSBP: TARGET_SBP, targetDBP: TARGET_DBP
    },
    daily
  };
}

function fmt(v) { return v == null ? '—' : v; }

function render(data, offline) {
  const s = data.summary, d = data.daily;
  if (!d.length) {
    $('#content').innerHTML = `
      ${offline ? '<div style="margin-bottom:1rem;"><span class="pill offline">離線模式</span></div>' : ''}
      <div class="empty">此區間尚無早晨/晚間紀錄</div>`;
    return;
  }
  const targetOK = s.avgDailySBP && s.avgDailyDBP && s.avgDailySBP < s.targetSBP && s.avgDailyDBP < s.targetDBP;
  const surgeWarn = s.avgMorningSurge !== null && s.avgMorningSurge >= 20;

  $('#content').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:0.75rem;flex-wrap:wrap;margin-bottom:1rem;">
      <div>
        <h2 style="margin:0;font-size:var(--text-lg);">期間摘要</h2>
        <p class="muted" style="margin:0.25rem 0 0;font-size:var(--text-sm);">
          ${d.length} 天紀錄 · 共 ${s.count} 筆 · 目標 ≦ ${s.targetSBP}/${s.targetDBP} mmHg
        </p>
      </div>
      ${offline ? '<span class="pill offline">離線資料</span>' : '<span class="pill">即時同步</span>'}
    </div>

    <div class="kpi-grid">
      <div class="kpi morning">
        <span class="label">☀️ 早晨平均</span>
        <div class="value">${fmt(s.avgMorningSBP)} / ${fmt(s.avgMorningDBP)}</div>
        <div class="sub">mmHg</div>
      </div>
      <div class="kpi evening">
        <span class="label">🌙 晚間平均</span>
        <div class="value">${fmt(s.avgEveningSBP)} / ${fmt(s.avgEveningDBP)}</div>
        <div class="sub">mmHg</div>
      </div>
      <div class="kpi daily">
        <span class="label">日均血壓</span>
        <div class="value">${fmt(s.avgDailySBP)} / ${fmt(s.avgDailyDBP)}</div>
        <div class="sub">最高 ${fmt(s.maxSBP)} · 最低 ${fmt(s.minSBP)}</div>
      </div>
      <div class="kpi target ${targetOK?'ok':'warn'}" id="targetCard">
        <span class="label">達標率
          <button id="modeToggle" class="mode-toggle is-strict" title="點擊切換：嚴格（只計完整量測日）↔寬鬆（包含漏量日）">
            <span id="modeLabel">嚴格</span>
          </button>
        </span>
        <div class="value" id="targetValue">—</div>
        <div class="sub" id="targetSub">—</div>
      </div>
    </div>

    <!-- 達標率計算口徑說明（幫助使用者、醫師一眼讀懂數字代表什麼）-->
    <details class="target-def" id="targetDef">
      <summary>
        <span class="target-def-key">達標率定義</span>
        <span class="target-def-now" id="targetDefNow">嚴格：完整量測日的達標比例</span>
      </summary>
      <div class="target-def-body">
        <p><span class="badge-strict">嚴格</span> 完整日達標數 ÷ 完整量測日數（只計「早+晚都量」的日子）</p>
        <p><span class="badge-loose">寬鬆</span> 達標日數（含部分日） ÷ 所有量測日數（包含只量一段的日子，但不含完全沒量的日子）</p>
        <p class="muted small">血壓達標標準：日均 ≤ ${s.targetSBP}/${s.targetDBP} mmHg；心跳達標標準：日均 60–100 bpm。兩者都是「達醫學參考值」的比例，不是量測完成度。</p>
      </div>
    </details>

    ${s.avgMorningSurge !== null ? `
      <div class="muted" style="margin-top:1rem;font-size:var(--text-sm);">
        平均晨峰 (Morning Surge) =
        <strong>${s.avgMorningSurge > 0 ? '+' : ''}${s.avgMorningSurge} mmHg</strong>
        ${surgeWarn ? '<span class="warn-text"> · 偏高，建議與醫師討論</span>' : ''}
      </div>` : ''}

    ${s.avgDailyPulse !== null && s.avgDailyPulse !== undefined ? `
      <div class="pulse-section">
        <h3>💗 心跳分析</h3>
        <div class="kpi-grid">
          <div class="kpi pulse">
            <span class="label">⛅ 早晨心跳</span>
            <div class="value">${fmt(s.avgMorningPulse)}</div>
            <div class="sub">bpm</div>
          </div>
          <div class="kpi pulse">
            <span class="label">🌙 晚間心跳</span>
            <div class="value">${fmt(s.avgEveningPulse)}</div>
            <div class="sub">bpm</div>
          </div>
          <div class="kpi pulse">
            <span class="label">日均心跳</span>
            <div class="value">${fmt(s.avgDailyPulse)}</div>
            <div class="sub">最高 ${fmt(s.maxPulse)} · 最低 ${fmt(s.minPulse)} bpm</div>
          </div>
          <div class="kpi target ok" id="pulseTargetCard">
            <span class="label">心跳達標率
              <button id="pulseModeToggle" class="mode-toggle is-strict" title="點擊切換：嚴格（只計完整量測日）↔寬鬆（包含漏量日）">
                <span id="pulseModeLabel">嚴格</span>
              </button>
            </span>
            <div class="value" id="pulseTargetValue">—</div>
            <div class="sub" id="pulseTargetSub">—</div>
          </div>
        </div>
      </div>` : ''}

    <hr style="margin:1.5rem 0;border:0;border-top:1px solid color-mix(in oklab, var(--color-text) 8%, transparent);">

    <h2 style="margin:0 0 1rem;font-size:var(--text-lg);">趨勢圖</h2>
    <canvas id="chart"></canvas>
    <div class="legend">
      <span><span class="swatch" style="background:${COLORS.morning}"></span>早晨 SBP</span>
      <span><span class="swatch" style="background:${COLORS.evening}"></span>晚間 SBP</span>
      <span><span class="swatch" style="background:${COLORS.daily}"></span>日均 SBP</span>
      <span><span class="swatch" style="background:${COLORS.target}"></span>目標 ${s.targetSBP}</span>
      <span><span class="swatch" style="background:#c8456f"></span>日均心跳</span>
    </div>

    <hr style="margin:1.5rem 0;border:0;border-top:1px solid color-mix(in oklab, var(--color-text) 8%, transparent);">

    <h2 style="margin:0 0 1rem;font-size:var(--text-lg);">每日明細</h2>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr>
          <th>日期</th><th>早晨</th><th>晚間</th><th>日均</th><th>心跳</th><th>晨峰</th><th>達標</th>
        </tr></thead>
        <tbody>
          ${d.slice().reverse().map(row => `
            <tr class="${row.isComplete === false ? 'partial-day' : ''}" title="${row.isComplete === false ? '部分日：僅量測單段' : ''}">
              <td>${row.date.slice(5)}${row.isComplete === false ? ' <span class="partial-mark" title="部分量測日">⚠️</span>' : ''}</td>
              <td>${row.morningSBP?`${row.morningSBP}/${row.morningDBP}`:'<span class="missing">未量</span>'} ${row.morningSBP ? `<span class="muted">(${row.morningCount})</span>` : ''}</td>
              <td>${row.eveningSBP?`${row.eveningSBP}/${row.eveningDBP}`:'<span class="missing">未量</span>'} ${row.eveningSBP ? `<span class="muted">(${row.eveningCount})</span>` : ''}</td>
              <td><strong>${row.dailySBP?`${row.dailySBP}/${row.dailyDBP}`:'—'}</strong></td>
              <td>${row.dailyPulse ? row.dailyPulse + ' bpm' : '—'}</td>
              <td>${row.morningSurge !== null ? (row.morningSurge>0?'+':'')+row.morningSurge : '—'}</td>
              <td><span class="badge-dot ${row.targetMet?'ok':'no'}"></span></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="exportCSV()">匯出 CSV</button>
      <button class="btn btn-secondary" onclick="window.print()">列印給醫師</button>
    </div>
  `;
  drawChart(d, s.targetSBP);
  window._lastDaily = d;
  window._lastSummary = s;
  applyTargetMode();   // 依用戶偏好的嚴格/寬鬆設定重新渲染達標卡
  // 切換鈕事件（render 重生成的 DOM） — 血壓、心跳兩張卡同步
  const toggleMode = () => {
    const cur = localStorage.getItem('bp.targetMode') || 'strict';
    localStorage.setItem('bp.targetMode', cur === 'strict' ? 'loose' : 'strict');
    applyTargetMode();
  };
  const tBtn = document.getElementById('modeToggle');
  if (tBtn) tBtn.addEventListener('click', toggleMode);
  const pBtn = document.getElementById('pulseModeToggle');
  if (pBtn) pBtn.addEventListener('click', toggleMode);
}

function applyTargetMode() {
  const s = window._lastSummary;
  if (!s) return;
  const mode = localStorage.getItem('bp.targetMode') || 'strict';

  // 通用套用函式：同樣的邏輯抽出來套在血壓、心跳兩張卡
  const renderCard = (opts) => {
    const valueEl = document.getElementById(opts.valueId);
    const subEl   = document.getElementById(opts.subId);
    const btn     = document.getElementById(opts.btnId);
    const card    = document.getElementById(opts.cardId);
    const label   = document.getElementById(opts.labelId);
    if (!valueEl || !subEl) return;
    if (mode === 'loose') {
      const rate = (s[opts.rateLooseKey] != null ? s[opts.rateLooseKey] : s[opts.rateKey]);
      const num  = (s[opts.daysLooseKey] != null ? s[opts.daysLooseKey] : s[opts.daysKey]);
      valueEl.innerText = rate + '%';
      subEl.innerText   = `${num} / ${s.totalDays} ${opts.looseSub}`;
      if (label) label.innerText = '寬鬆';
      if (btn)   { btn.classList.remove('is-strict'); btn.classList.add('is-loose'); }
      if (card)  {
        card.classList.add('is-loose-mode');
        card.classList.toggle('ok',   rate >= 80);
        card.classList.toggle('warn', rate <  80);
      }
    } else {
      const rate = s[opts.rateKey];
      const c    = s.completeDays != null ? s.completeDays : s.totalDays;
      valueEl.innerText = (rate != null ? rate : 0) + '%';
      subEl.innerText   = `${s[opts.daysKey] != null ? s[opts.daysKey] : 0} / ${c} ${opts.strictSub}${s.partialDays ? ` · 另有 ${s.partialDays} 部分日未計入` : ''}`;
      if (label) label.innerText = '嚴格';
      if (btn)   { btn.classList.remove('is-loose'); btn.classList.add('is-strict'); }
      if (card)  {
        card.classList.remove('is-loose-mode');
        card.classList.toggle('ok',   rate >= 80);
        card.classList.toggle('warn', rate <  80);
      }
    }
  };

  // ① 血壓達標卡
  renderCard({
    valueId:'targetValue', subId:'targetSub', btnId:'modeToggle',
    cardId:'targetCard', labelId:'modeLabel',
    rateKey:'targetMetRate', rateLooseKey:'targetMetRateLoose',
    daysKey:'targetMetDays', daysLooseKey:'targetMetDaysLoose',
    strictSub:'完整日達標', looseSub:'量測日達標（含部分日）'
  });

  // ② 心跳達標卡
  renderCard({
    valueId:'pulseTargetValue', subId:'pulseTargetSub', btnId:'pulseModeToggle',
    cardId:'pulseTargetCard', labelId:'pulseModeLabel',
    rateKey:'pulseMetRate', rateLooseKey:'pulseMetRateLoose',
    daysKey:'pulseMetDays', daysLooseKey:'pulseMetDaysLoose',
    strictSub:'完整日在 60–100 bpm', looseSub:'量測日在 60–100 bpm（含部分日）'
  });

  // ③ 定義卷右側「目前採用」提示同步切換
  const defNow = document.getElementById('targetDefNow');
  if (defNow) {
    defNow.innerText = (mode === 'loose')
      ? '寬鬆：所有量測日的達標比例'
      : '嚴格：完整量測日的達標比例';
  }
}

function drawChart(daily, targetSBP) {
  const ctx = document.getElementById('chart').getContext('2d');
  if (chart) chart.destroy();
  Chart.defaults.font.family = "'Satoshi','Inter',-apple-system,'PingFang TC',sans-serif";
  Chart.defaults.color = COLORS.text;
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: daily.map(d => d.date.slice(5)),
      datasets: [
        { label: '早晨 SBP', data: daily.map(d => d.morningSBP),
          borderColor: COLORS.morning, backgroundColor: COLORS.morning,
          tension: 0.25, spanGaps: true, pointRadius: 3, borderWidth: 2 },
        { label: '晚間 SBP', data: daily.map(d => d.eveningSBP),
          borderColor: COLORS.evening, backgroundColor: COLORS.evening,
          tension: 0.25, spanGaps: true, pointRadius: 3, borderWidth: 2 },
        { label: '日均 SBP', data: daily.map(d => d.dailySBP),
          borderColor: COLORS.daily, backgroundColor: COLORS.daily,
          tension: 0.25, spanGaps: true, pointRadius: 4, borderWidth: 2.5 },
        { label: `目標 ${targetSBP}`, data: daily.map(() => targetSBP),
          borderColor: COLORS.target, borderDash: [5, 5], borderWidth: 1.5, pointRadius: 0,
          yAxisID: 'y' },
        { label: '日均心跳', data: daily.map(d => d.dailyPulse),
          borderColor: '#c8456f', backgroundColor: '#c8456f',
          borderDash: [3, 3], tension: 0.25, spanGaps: true, pointRadius: 2.5, borderWidth: 1.8,
          yAxisID: 'yPulse' }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { suggestedMin: 90, suggestedMax: 170, position: 'left',
             title: { display: true, text: 'mmHg', color: COLORS.axis, font: { weight: 700 } },
             grid: { color: COLORS.grid },
             ticks: { color: COLORS.axis, font: { weight: 600, size: 11 } } },
        yPulse: { suggestedMin: 50, suggestedMax: 110, position: 'right',
             title: { display: true, text: 'bpm', color: '#c8456f', font: { weight: 700 } },
             grid: { display: false },
             ticks: { color: '#c8456f', font: { weight: 600, size: 11 } } },
        x: { grid: { color: COLORS.grid },
             ticks: { color: COLORS.axis, font: { weight: 600, size: 11 } } }
      }
    }
  });
}

function exportCSV() {
  const d = window._lastDaily || [];
  if (!d.length) return;
  const header = ['date','morningSBP','morningDBP','morningPulse','morningCount','eveningSBP','eveningDBP','eveningPulse','eveningCount','dailySBP','dailyDBP','dailyPulse','morningSurge','targetMet'];
  const rows = [header.join(',')].concat(d.map(r => header.map(k => r[k] == null ? '' : r[k]).join(',')));
  const blob = new Blob([rows.join('\n')], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const tag = (currentRange === 'custom' && currentFrom && currentTo)
    ? `${currentFrom}_to_${currentTo}` : currentRange;
  a.download = `bp-${tag}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

$$('.range-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.range-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRange = btn.dataset.range;
    if (currentRange === 'custom') {
      $('#customRange').hidden = false;
      // 預設：今天 與 7 天前
      const today = new Date(), prev = new Date(); prev.setDate(today.getDate() - 6);
      const pad = n => String(n).padStart(2,'0');
      const fmtD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      if (!$('#dateFrom').value) $('#dateFrom').value = fmtD(prev);
      if (!$('#dateTo').value)   $('#dateTo').value   = fmtD(today);
    } else {
      $('#customRange').hidden = true;
      currentFrom = currentTo = null;
      loadStats(currentRange);
    }
  });
});

function applyCustomRange() {
  const from = $('#dateFrom').value;
  const to   = $('#dateTo').value;
  if (!from || !to) { alert('請選擇起始與結束日期'); return; }
  if (from > to)    { alert('起始日期不能晚於結束日期'); return; }
  currentFrom = from; currentTo = to;
  loadStats('custom', from, to);
}
$('#applyRange').addEventListener('click', applyCustomRange);

function quickSetRange(from, to) {
  $('#dateFrom').value = from;
  $('#dateTo').value   = to;
  applyCustomRange();
}
const pad = n => String(n).padStart(2,'0');
const fmtD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
$('#quickThisMonth').addEventListener('click', () => {
  const today = new Date();
  const first = new Date(today.getFullYear(), today.getMonth(), 1);
  quickSetRange(fmtD(first), fmtD(today));
});
$('#quickLastMonth').addEventListener('click', () => {
  const today = new Date();
  const first = new Date(today.getFullYear(), today.getMonth()-1, 1);
  const last  = new Date(today.getFullYear(), today.getMonth(), 0);
  quickSetRange(fmtD(first), fmtD(last));
});
$('#quickYTD').addEventListener('click', () => {
  const today = new Date();
  const first = new Date(today.getFullYear(), 0, 1);
  quickSetRange(fmtD(first), fmtD(today));
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').then(reg => {
    reg.update().catch(() => {});
  }).catch(console.warn);
  // 控制權一交接就重載（使用者在首頁按「套用新版」時才有效）
  let _r = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (_r) return; _r = true; location.reload();
  });
}

loadStats('week');
</script>
</body>
</html>
